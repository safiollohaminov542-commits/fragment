<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Donezo · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1000px 600px at -10% -20%, #d4ebd9 0%, transparent 50%),
      radial-gradient(900px 500px at 110% 120%, #c9e7d4 0%, transparent 60%),
      #f1f3f1;
    min-height: 100vh;
    display: grid; place-items: center;
    color: #1a1d1b;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 420px;
    background: #fff;
    border-radius: 24px;
    padding: 36px 32px;
    box-shadow: 0 30px 70px -25px rgba(20,92,57,0.25), 0 1px 0 rgba(0,0,0,0.02);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 28px;
  }
  .brand-logo {
    width: 38px; height: 38px;
    background: #1f7a4d;
    border-radius: 11px;
    display: grid; place-items: center;
    color: #fff;
  }
  .brand-name { font-weight: 800; font-size: 20px; letter-spacing: -0.3px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 4px; }
  .sub { color: #7b8079; font-size: 13px; margin-bottom: 24px; }
  label {
    display: block; font-size: 12px; font-weight: 600;
    color: #555; margin-bottom: 6px;
  }
  input {
    width: 100%; font: inherit; font-size: 14px;
    padding: 12px 14px;
    border: 1px solid #ebebeb;
    background: #fafafa;
    border-radius: 12px;
    outline: none;
    transition: all .15s ease;
    margin-bottom: 14px;
  }
  input:focus {
    border-color: #1f7a4d;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(31,122,77,0.1);
  }
  button {
    width: 100%; font: inherit; font-weight: 600;
    background: #1f7a4d; color: #fff; border: none;
    padding: 13px; border-radius: 999px;
    cursor: pointer; font-size: 14px;
    margin-top: 6px;
    transition: background .15s ease;
  }
  button:hover { background: #145c39; }
  .err {
    background: #fdecec; color: #c14545;
    padding: 10px 12px; border-radius: 10px;
    font-size: 12px; margin-bottom: 14px;
  }
  .hint {
    margin-top: 18px; padding-top: 18px;
    border-top: 1px solid #f0f0f0;
    font-size: 12px; color: #7b8079;
    line-height: 1.5;
  }
  .hint code {
    background: #f5f5f4; padding: 2px 6px;
    border-radius: 4px; font-size: 11px;
  }
</style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg>
      </div>
      <div class="brand-name">Donezo</div>
    </div>
    <h1>Воридшавӣ</h1>
    <p class="sub">Барои идоракунии userbot-ҳо ворид шавед.</p>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}

    <label>Логин</label>
    <input name="login" autocomplete="username" autofocus required />

    <label>Парол</label>
    <input name="password" type="password" autocomplete="current-password" required />

    <button type="submit">Воридшавӣ</button>

    <div class="hint">
      Standartы: <code>admin</code> / <code>xxxcoderxxxtj</code><br/>
      Барои тағйир додан, env vars: <code>ADMIN_LOGIN</code>, <code>ADMIN_PASSWORD</code>
    </div>
  </form>
</body>
</html>
